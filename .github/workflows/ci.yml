name: CI

# This runs on pushes to the 'master' branch and any pull request.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # --- Build Matrix ---
    # This creates a parallel job for each Node.js version listed.
    strategy:
      matrix:
        node-version: [12, 16, 18, 22]

    # Name the job dynamically in the UI for clarity
    name: Node.js ${{ matrix.node-version }} Test

    steps:
      # 1. Check out the repository code
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 2. Set up the specified Node.js version and cache npm dependencies
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      # 3. Install dependencies
      - name: Install dependencies
        run: npm i

      # 4. Build dbscripts.json
      - name: Build dbscripts.json
        run: npm run build

      # 5. Verify the committed dbscripts.json matches the build output
      - name: Verify dbscripts.json is up to date
        run: git diff --exit-code dbscripts.json

      # 6. Run tests
      - name: Run Jest tests
        run: npm run test

  deploy:
    runs-on: ubuntu-latest
    name: Deploy to S3
    needs: build-and-test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm i

      - name: Build dbscripts.json
        run: npm run build

      - name: Configure AWS Credentials using OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.awsIAMS3UploadRole }}
          role-session-name: github-action-db-connections-templates-deploy
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to S3
        run: aws s3 cp ./dbscripts.json s3://${{ secrets.AWS_S3_BUCKET }}/extensibility/dbscripts/dbscripts.json
